<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ZigZagElliot Alert Viewer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">ELLIOTT SIGNAL ARCHIVE</p>
      <h1>ZigZagElliot Alert Viewer</h1>
      <p class="subtitle">アラート時点の波動構造を、Run単位で検索・比較します。</p>
    </div>
    <div class="header-actions">
      <a class="secondary-button app-link" href="/react/">React版を試す</a>
      <div class="connection" id="connectionStatus" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span>DB確認中</span>
      </div>
    </div>
  </header>

  <main>
    <section class="filter-panel" aria-labelledby="filterTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">SEARCH</p>
          <h2 id="filterTitle">アラート検索</h2>
        </div>
        <button class="ghost-button" id="resetButton" type="button">条件をリセット</button>
      </div>

      <form id="filterForm" class="filter-grid">
        <label class="field field-wide">
          <span>Run</span>
          <select id="runId" name="runId" aria-label="実行Run"></select>
        </label>
        <label class="field field-search">
          <span>キーワード</span>
          <input id="query" name="q" type="search" maxlength="200"
                 placeholder="波動ラベル、タイトル、シグナルキー">
        </label>
        <label class="field">
          <span>通貨</span>
          <select id="symbol" name="symbol"><option value="">すべて</option></select>
        </label>
        <label class="field">
          <span>方向</span>
          <select id="side" name="side">
            <option value="">BUY＋SELL</option>
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
        </label>
        <label class="field">
          <span>H1構造</span>
          <select id="rank" name="rank"><option value="">すべて</option></select>
        </label>
        <label class="field">
          <span>W1方向</span>
          <select id="w1Aligned" name="w1Aligned">
            <option value="all">すべて</option>
            <option value="aligned">アラートと一致</option>
            <option value="mismatched">アラートと不一致</option>
            <option value="unknown">不明</option>
          </select>
        </label>
        <label class="field">
          <span>開始日（JST）</span>
          <input id="fromDate" name="from" type="date">
        </label>
        <label class="field">
          <span>終了日（JST）</span>
          <input id="toDate" name="to" type="date">
        </label>
        <label class="field field-small">
          <span>表示件数</span>
          <select id="pageSize" name="pageSize">
            <option value="25">25件</option>
            <option value="50" selected>50件</option>
            <option value="100">100件</option>
          </select>
        </label>
        <div class="filter-actions">
          <button class="primary-button" type="submit">検索する</button>
          <button class="secondary-button" id="exportButton" type="button">CSV出力</button>
        </div>
      </form>
    </section>

    <section class="summary-grid" id="summaryCards" aria-label="検索結果集計">
      <article class="summary-card"><span>総件数</span><strong id="totalCount">—</strong></article>
      <article class="summary-card buy"><span>BUY</span><strong id="buyCount">—</strong></article>
      <article class="summary-card sell"><span>SELL</span><strong id="sellCount">—</strong></article>
      <article class="summary-card align"><span>W1一致</span><strong id="alignedCount">—</strong></article>
      <article class="summary-card mismatch"><span>W1不一致</span><strong id="mismatchedCount">—</strong></article>
    </section>

    <section class="results-panel" aria-labelledby="resultsTitle">
      <div class="section-heading results-heading">
        <div>
          <p class="eyebrow">SNAPSHOTS</p>
          <h2 id="resultsTitle">アラート一覧</h2>
        </div>
        <p id="resultStatus" class="result-status" role="status" aria-live="polite">読み込み中</p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><button class="sort-button" data-sort="jst_time">JST日時</button></th>
              <th><button class="sort-button" data-sort="symbol_name">通貨</button></th>
              <th><button class="sort-button" data-sort="side">方向</button></th>
              <th>判定</th>
              <th><button class="sort-button" data-sort="h1_structure_rank">構造・波動</button></th>
              <th>MN1 → H1 分析方向</th>
              <th><button class="sort-button" data-sort="is_w1_aligned">W1一致</button></th>
              <th><button class="sort-button" data-sort="risk_pips">Risk / Spread</button></th>
              <th><button class="sort-button" data-sort="entry_result">ENTRY</button></th>
            </tr>
          </thead>
          <tbody id="alertRows"></tbody>
        </table>
        <div class="empty-state" id="emptyState" hidden>
          <strong>該当するアラートはありません</strong>
          <span>検索条件を変更してください。</span>
        </div>
      </div>

      <nav class="pagination" aria-label="ページ移動">
        <button class="ghost-button" id="previousPage" type="button">前へ</button>
        <span id="pageIndicator">1 / 1</span>
        <button class="ghost-button" id="nextPage" type="button">次へ</button>
      </nav>
    </section>
  </main>

  <button class="drawer-backdrop" id="drawerBackdrop" type="button"
          aria-label="詳細を閉じる" hidden></button>
  <aside class="detail-drawer" id="detailDrawer" role="dialog" aria-modal="true"
         aria-labelledby="detailTitle" aria-hidden="true" inert>
    <div class="drawer-header">
      <div>
        <p class="eyebrow">ALERT SNAPSHOT</p>
        <h2 id="detailTitle">アラート詳細</h2>
      </div>
      <button class="close-button" id="closeDrawer" type="button" aria-label="詳細を閉じる">×</button>
    </div>
    <div class="drawer-body" id="detailContent">
      <p class="loading-message">詳細を読み込んでいます…</p>
    </div>
  </aside>

  <div class="toast" id="toast" role="alert" aria-live="assertive" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
